name: Android verification

on:
  push:
    branches: [main, "phase/m2-skeleton"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Run required builds and checks
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleRelease bundleRelease
