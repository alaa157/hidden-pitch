name: Android verification

on:
  push:
    branches: [main, "phase/m2-skeleton"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Run required builds and checks
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleRelease bundleRelease
